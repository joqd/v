[project]
name = "v"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "openai>=3.14.1",
    "python-dotenv>=1.2.3",
    "python-socks[asyncio]>=3.1.1",
    "sqlmodel>=0.0.42",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
exclude = [
	"**/migrations/**",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "single"
